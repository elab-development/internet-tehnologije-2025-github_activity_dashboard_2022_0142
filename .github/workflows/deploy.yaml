name: Deploy Next.js to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure Subscription
        run: az account set --subscription 4d54cacd-5b79-43cf-8dd0-95ee1c075a0d

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        run: |
          # Ensure image name is ALL LOWERCASE (e.g., nextjs-app)
          IMAGE_TAG="${{ secrets.REGISTRY_LOGIN_SERVER }}/nextjs-app:${{ github.sha }}"
          docker build . -t $IMAGE_TAG
          docker push $IMAGE_TAG

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/nextjs-app:${{ github.sha }}
          resourceGroup: iteh-project
          containerAppName: github-activity-dash