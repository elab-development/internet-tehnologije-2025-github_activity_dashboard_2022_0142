name: CI + Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: "password"
          MYSQL_DATABASE: "testdb"
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install chromium

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/testdb"

      - name: Setup DB
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/testdb"

      - name: Seed DB
        run: npx prisma db seed
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/testdb"

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/testdb"
          UPSTASH_REDIS_REST_URL: "http://127.0.0.1:6379"
          UPSTASH_REDIS_REST_TOKEN: "example_token"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/testdb"
          UPSTASH_REDIS_REST_URL: "http://127.0.0.1:6379"
          UPSTASH_REDIS_REST_TOKEN: "example_token"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GITHUB_ACTIONS: "true"

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/testdb"
          UPSTASH_REDIS_REST_URL: "http://127.0.0.1:6379"
          UPSTASH_REDIS_REST_TOKEN: "example_token"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GITHUB_ACTIONS: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7


  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Subscription
        run: az account set --subscription 4d54cacd-5b79-43cf-8dd0-95ee1c075a0d

      - name: Login to ACR
        run: az acr login --name itehproject

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ secrets.REGISTRY_LOGIN_SERVER }}/nextjs-app:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/nextjs-app:${{ github.sha }}
          resourceGroup: iteh-project
          containerAppName: github-activity-dash